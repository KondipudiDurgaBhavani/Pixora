<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixora | Your Style, Your Moments</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="login-container">
        <div class="brand">
            <h1>pixora<span>.</span></h1>
            <p>Your style, your moments.</p>
        </div>
        <div class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">Sign in to continue to your world.</p>
            <form id="loginForm">
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username or email"
                    required
                >
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <div class="forgot-row">
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
                <p id="message" class="message" role="status"></p>
            </form>
            <div class="divider">
                <span>OR</span>
            </div>
            <button type="button" class="guest-btn" id="guestLogin">
                Explore Pixora
            </button>
            <p class="signup-text">
                New to Pixora?
                <a href="#" id="createAccount">Create an account</a>
            </p>
        </div>
        <footer>
            Made with care, just for your moments. ♡
        </footer>
    </main>
    <script src="./script.js"></script>
</body>
</html>
