<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff9f5">

    <title>Pixora | Your Style, Your Moments</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="decor decor-left" aria-hidden="true"></div>
    <div class="decor decor-right" aria-hidden="true"></div>

    <main class="page-container">

        <!-- Pixora Logo -->
        <header class="brand-header">
            <a href="./index.html" class="brand-logo" aria-label="Pixora home">
                <span class="logo-word">pixora<span class="gold-dot">.</span></span>
                <span class="logo-sparkle" aria-hidden="true">✦</span>
                <span class="logo-leaf" aria-hidden="true">❧</span>
            </a>

            <p class="tagline">Your style, your moments.</p>
        </header>

        <!-- Login Card -->
        <section class="login-card" aria-labelledby="welcomeTitle">

            <div class="welcome-section">
                <h1 id="welcomeTitle">Welcome Back!</h1>
                <p>Sign in to continue to your world.</p>
            </div>

            <form id="loginForm">

                <!-- Username or Email -->
                <div class="form-group">
                    <label for="email">Username or Email</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"/>
                            <path d="m3 7 9 6 9-6"/>
                        </svg>

                        <input
                            type="text"
                            id="email"
                            name="username"
                            placeholder="Enter your username or email"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <svg class="input-icon"
                             xmlns="http://www.w3.org/2000/svg"
                             width="22"
                             height="22"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true">
                            <rect x="3" y="11" width="18" height="10" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <!-- Show / Hide Password -->
                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >

                            <svg id="eyeIcon"
                                 xmlns="http://www.w3.org/2000/svg"
                                 width="22"
                                 height="22"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-row">
                    <button type="button" id="forgotPassword">
                        Forgot password?
                    </button>
                </div>

                <!-- Sign In -->
                <button type="submit" class="primary-button">
                    Sign In <span aria-hidden="true">→</span>
                </button>

                <!-- Divider -->
                <div class="divider" aria-label="or">
                    <span></span>
                    <p>OR</p>
                    <span></span>
                </div>

                <!-- Explore -->
                <button
                    type="button"
                    id="exploreButton"
                    class="secondary-button"
                >
                    Explore Pixora
                </button>

                <!-- Status Message -->
                <p
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                ></p>

                <!-- Create Account -->
                <p class="signup-text">
                    New to Pixora?
                    <button type="button" id="createAccount">
                        Create an account
                    </button>
                </p>

            </form>
        </section>

        <!-- Footer -->
        <footer class="page-footer">
            Made with care, just for your moments.
            <span aria-hidden="true">♡</span>
        </footer>

    </main>

    <script src="./script.js"></script>

</body>
</html>
