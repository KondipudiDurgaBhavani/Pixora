<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixora | Your Style, Your Moments</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="decor decor-left"></div>
    <div class="decor decor-right"></div>

    <main class="page-container">

        <!-- Pixora Brand -->
        <header class="brand-header">

            <a href="./index.html" class="brand-logo" aria-label="Pixora home">
                <span class="logo-word">pixora<span class="gold-dot">.</span></span>
                <span class="logo-sparkle">✦</span>
                <span class="logo-leaf">❧</span>
            </a>

            <p class="tagline">Your style, your moments.</p>

        </header>

        <!-- Login Card -->
        <section class="login-card">

            <div class="welcome-section">
                <h1>Welcome Back!</h1>
                <p>Sign in to continue to your world.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">Username or Email</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username or email"
                            autocomplete="username"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            ◉
                        </button>
                    </div>

                </div>

                <div class="forgot-row">
                    <button type="button" id="forgotPassword">
                        Forgot password?
                    </button>
                </div>

                <button type="submit" class="primary-button">
                    Sign In <span>→</span>
                </button>

                <div class="divider">
                    <span></span>
                    <p>OR</p>
                    <span></span>
                </div>

                <button
                    type="button"
                    id="exploreButton"
                    class="secondary-button"
                >
                    Explore Pixora
                </button>

                <p id="message" class="message" role="status"></p>

                <p class="signup-text">
                    New to Pixora?
                    <button type="button" id="createAccount">
                        Create an account
                    </button>
                </p>

            </form>

        </section>

        <footer class="page-footer">
            Made with care, just for your moments. <span>♡</span>
        </footer>

    </main>

    <script src="./script.js"></script>

</body>
</html>
